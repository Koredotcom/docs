name: Auto-sync from Kore prod repo (non-ff is allowed)

on:
  schedule:
  workflow_dispatch: {}      # run manually from Actions tab

permissions:
  contents: write            # required to push to your fork

env:
  UPSTREAM: Koredotcom/docs
  DEFAULT_BRANCH: dev

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream & fetch
        run: |
          git remote add upstream https://github.com/${{ env.UPSTREAM }}.git
          git fetch upstream --prune

      - name: Merge upstream -> fork (allow non-ff)
        run: |
          git checkout "$DEFAULT_BRANCH"
          # Try a regular merge (creates a merge commit if needed)
          if git merge --no-edit "upstream/$DEFAULT_BRANCH"; then
            git push origin "$DEFAULT_BRANCH"
            echo "Synced with upstream (merge completed)."
          else
            echo "::error ::Merge conflicts detected. Resolve manually in your fork, then re-run."
            exit 1
          fi
