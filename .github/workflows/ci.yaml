name: ci 
on:
  push:
    branches:
      - main
      - dev
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true      
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # Install build dependencies FIRST
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential python3-dev

      - uses: actions/setup-python@v4
        with:
          python-version: 3.11

      # Install required Python packages (combine for efficiency)
      - name: Install Python packages
        run: |
          pip install --upgrade pip
          pip install mkdocs-material mike mkdocs-glightbox mkdocs-redirects

      # Build docs (you can loop over configs if you want, but keeping original for clarity)
      - name: Build EN XO docs
        uses: ./
        with:
          entrypoint: mkdocs
          args: build --config-file=mkdocs.en.xo.yml
      - name: Build JA XO docs
        uses: ./
        with:
          entrypoint: mkdocs
          args: build --config-file=mkdocs.ja.xo.yml    
      - name: Build KO XO docs
        uses: ./
        with:
          entrypoint: mkdocs
          args: build --config-file=mkdocs.ko.xo.yml  
      - name: Build EN xo docs v10
        uses: ./
        with:
          entrypoint: mkdocs
          args: build --config-file=mkdocs.en.xo_v10.yml  
      - name: Build EN GALE docs
        uses: ./
        with:
          entrypoint: mkdocs
          args: build --config-file=mkdocs.en.gale.yml   
      - name: Build EN EVA docs
        uses: ./
        with:
          entrypoint: mkdocs
          args: build --config-file=mkdocs.en.eva.yml     
      - name: Build EN AGENT-PLATFORM docs
        uses: ./
        with:
          entrypoint: mkdocs
          args: build --config-file=mkdocs.en.agent-platform.yml            

      # - name: Copy redirect index page
      #   run: sudo cp /index.html /site

      - name: Deploy docs to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site

      - uses: actions/cache@v4
        with:
          key: ${{ github.ref }}
          path: .cache
