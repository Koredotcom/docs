name: ci 
on:
  push:
    branches:
      - prod

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true      
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Build EN (In)Business Productivity docs
        uses: ./
        with:
          entrypoint: mkdocs
          args: build --config-file=mkdocs.en.business-productivity.yml
      - name: Build EN (In)Agent Platform docs
        uses: ./
        with:
          entrypoint: mkdocs
          args: build --config-file=mkdocs.en.agent-platform.yml

      # - name: Copy redirect index page
      #   run: sudo cp /index.html /site

      - uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Deploy docs to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site

      - uses: actions/cache@v4
        with:
          key: ${{ github.ref }}
          path: .cache
      - run: pip install mkdocs-material 
      - run: pip install mike --force-reinstall --verbose
      - run: pip install mkdocs-glightbox
      # - run: mike deploy --push --update-aliases 1.0 latest --ignore
      # - run: mkdocs gh-deploy --force
