site_name: Inceptionai Docs
site_author: Inceptionai Content Experience Team
docs_dir: 'docs/ai-for-work/'
site_dir: 'site/business-productivity/'
site_url: https://inceptionai.ai/
repo_name: inceptionai-public/platform-docs
repo_url: https://github.com/inceptionai-public/platform-docs
extra_css:
    - stylesheets/extra_kore.css
theme:
  favicon: images/favicon.png
  name: material
  custom_dir: overrides.en.business-productivity
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.path
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
    - header.autohide
  language: en
  palette:
    - scheme: default
      toggle:
        icon: material/toggle-switch-off-outline 
        name: Switch to dark mode
      primary: indigo
      accent: indigo
    - scheme: slate 
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode    
      primary: indigo
      accent: lime
plugins:
  - search:
      lang: tr
  - glightbox   
  - redirects:
      redirect_maps:
        'getting-started/quick-start-guide.md': 'getting-started/setup-guide.md'
        'user-management/managing your users.md': 'user-management/managing-your-users.md'
        'security/sso.md': 'security/sso-overview.md'
        'APIs/audit-log-api.md': 'audit-log/audit-log-api.md'
        'custom-agents/default-rag.md': 'custom-agents/enterprise-knowledge.md'
extra:
  version:
    provider: mike
  generator: false
  analytics:
    provider: google
    property: G-560BYJFH0P
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/thumb-up-outline
          name: This page was helpful
          data: 1
          note: >-
            Thanks for your feedback!
        - icon: material/thumb-down-outline
          name: This page could be improved
          data: 0
          note: >-                       
            Thanks for your feedback!            
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - extra_js/feedback.js
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      title: On this Page
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: squidfunk
      repo: mkdocs-material
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

copyright: |
